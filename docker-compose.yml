version: '3.8'

services:
  app:
    build: .
    container_name: nexvorameeting_app
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/nexvorameeting
      - JWT_SECRET=nexvora-production-secret-key-2026
    depends_on:
      - mongo

  mongo:
    image: mongo:latest
    container_name: nexvorameeting_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
